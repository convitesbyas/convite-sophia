<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#391d24"><title>Sophia XV • Um convite especial</title><meta property="og:title" content="Sophia XV • Você é meu convidado especial!"><meta property="og:description" content="Um conto de fadas espera por você. Abra o convite!"><meta property="og:image" content="capa-whatsapp.jpg"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#130d12;color:#fff;font-family:Georgia,serif}body{overflow-x:hidden}button,a{touch-action:manipulation}#app{min-height:100dvh} .screen{display:none;min-height:100dvh}.screen.active{display:block}.art{position:relative;margin:auto;width:min(100%,600px);line-height:0}.art img{width:100%;height:auto;display:block}.hotspot{position:absolute;z-index:2;cursor:pointer;background:transparent;border:0;border-radius:14px;touch-action:manipulation}.hotspot:focus-visible{outline:3px solid #fff;outline-offset:2px;background:#ffffff30}.hotspot:active{background:#ffffff20}.envelope{left:28%;top:45%;width:44%;height:16%}#videoScreen{position:fixed;inset:0;background:#000;z-index:5}#videoScreen.active{display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}#playIntro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:#821b48;color:white;border:2px solid #f5c98a;border-radius:30px;padding:16px 22px;font-size:17px;cursor:pointer;display:none;white-space:nowrap}#playIntro.show{display:block}#skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));right:18px;background:#7c173a;color:#fff;border:1px solid #efbb87;border-radius:24px;padding:12px 20px;font-size:15px;cursor:pointer}.floating{position:fixed;z-index:10;right:12px;top:max(12px,env(safe-area-inset-top));display:none;gap:8px}.floating.show{display:flex}.round{border:1px solid #f4ce90;background:#741b3de8;color:white;border-radius:999px;padding:10px 13px;cursor:pointer;box-shadow:0 3px 12px #0008;font-size:14px}.location{left:13%;top:53.2%;width:74%;height:4.2%}.confirm{left:10%;top:67.1%;width:39%;height:5.2%}.manual{left:51%;top:67.1%;width:39%;height:5.2%}.gifts{left:10%;top:72.7%;width:39%;height:5.2%}.messages{left:51%;top:72.7%;width:39%;height:5.2%}.back{position:fixed;z-index:9;left:12px;top:max(12px,env(safe-area-inset-top));background:#741b3de8;border:1px solid #f4ce90;color:#fff;border-radius:24px;padding:11px 16px;cursor:pointer}.recado{left:12%;top:45%;width:76%;height:25%}.panel{max-width:600px;margin:0 auto;padding:72px 16px 32px;background:linear-gradient(145deg,#ffe8d8,#f7bfd0);color:#601d34;min-height:100dvh;text-align:center}.panel h1{font-size:30px}.panel p{line-height:1.5}.panel iframe{width:100%;height:75dvh;border:0;background:white;border-radius:12px}.primary{display:inline-block;background:#8b2149;color:white;border:0;border-radius:30px;padding:14px 22px;font:16px Georgia;cursor:pointer;text-decoration:none}.hint{font-size:13px;color:#734b55}.overlay{position:fixed;z-index:20;inset:0;background:#130b18b8;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.dialog{max-width:400px;background:#fff0e6;color:#59283b;padding:25px;border-radius:18px;text-align:center;box-shadow:0 10px 50px #0009}.dialog button{margin-top:14px}.edit .hotspot{outline:2px dashed #00e8ff;background:#00e8ff30}.edit .hotspot:after{content:attr(aria-label);position:absolute;left:0;top:0;color:white;background:#000b;font:11px sans-serif;line-height:1.2;padding:3px}#editPanel{display:none;position:fixed;z-index:15;bottom:10px;left:10px;background:#181818e8;padding:10px;border-radius:8px;font:12px sans-serif;max-width:85vw}.edit #editPanel{display:block}
</style></head><body><div id="app">
<section id="envelopeScreen" class="screen active"><div class="art"><img src="1.png" alt="Envelope encantado Sophia XV"><button class="hotspot envelope" aria-label="Abrir envelope" onclick="openEnvelope()"></button></div></section>
<section id="videoScreen" class="screen"><video id="intro" playsinline webkit-playsinline preload="auto"><source src="abertura.mp4" type="video/mp4">Seu navegador não conseguiu carregar o vídeo.</video><button id="playIntro" onclick="playIntroVideo()">▶ Assistir à abertura</button><button id="skip" onclick="finishIntro()">Pular abertura ›</button></section>
<section id="mainScreen" class="screen"><div class="art"><img src="3.png" alt="Convite Sophia XV, 6 de março de 2027 às 20 horas, Casa de Festas Aconchego"><button class="hotspot location" aria-label="Ver localização" onclick="openLocation()"></button><button class="hotspot confirm" aria-label="Confirmar presença" onclick="openConfirmation()"></button><button class="hotspot manual" aria-label="Manual de convidados" onclick="showScreen('manualScreen')"></button><button class="hotspot gifts" aria-label="Sugestão de presentes" onclick="showScreen('giftsScreen')"></button><button class="hotspot messages" aria-label="Recados para Sophia" onclick="showScreen('messagesScreen')"></button></div></section>
<section id="manualScreen" class="screen"><button class="back" onclick="showScreen('mainScreen')">‹ Voltar</button><div class="art"><img src="5.png" alt="Manual de convidados da Sophia"></div></section>
<section id="giftsScreen" class="screen"><button class="back" onclick="showScreen('mainScreen')">‹ Voltar</button><div class="art"><img src="4.png" alt="Sugestões de presentes para Sophia"></div></section>
<section id="messagesScreen" class="screen"><button class="back" onclick="showScreen('mainScreen')">‹ Voltar</button><div class="art"><img src="6.png" alt="Recados para Sophia"><button class="hotspot recado" aria-label="Escrever recado" onclick="openForm()"></button></div></section>
<section id="formScreen" class="screen"><button class="back" onclick="showScreen('messagesScreen')">‹ Voltar</button><div class="panel"><h1>Um recadinho para Sophia ♡</h1><p>Escreva uma mensagem especial para eternizar essa noite!</p><div id="formArea"></div></div></section>
<div class="floating" id="musicControls"><button class="round" id="musicButton" onclick="toggleMusic()" aria-label="Ativar ou pausar música">♫ Música</button></div>
<div class="overlay" id="modal"><div class="dialog"><h2 id="modalTitle">Aviso</h2><p id="modalText"></p><button class="primary" onclick="closeModal()">Entendi</button></div></div><div id="editPanel">Modo de teste: áreas clicáveis destacadas. Remova <b>?editar=1</b> da URL para publicar.</div>
<audio id="bgMusic" loop preload="auto"><source src="musica.m4a" type="audio/mp4"><source src="musica.mp3" type="audio/mpeg"></audio>
</div><script>
// PERSONALIZE AQUI: cole os links completos entre as aspas.
const CONFIG={
 localizacao:'https://www.google.com/maps/search/?api=1&query=Rua%20J%C3%BAlio%20C%C3%A9sar%201040%20Bangu%20Rio%20de%20Janeiro',
 confirmacaoWhatsApp:'5521999300761', // Ex.: '5521999999999' (somente números, com DDI 55)
 confirmacaoFormulario:'', // Opcional: URL de formulário para confirmação
 googleFormsRecados:'https://docs.google.com/forms/d/e/1FAIpQLSfvVPYMu4XEzcudm-VVxGKkZsqAq7gMM4lVCSLlYJ0GhO9Tag/viewform?usp=dialog', // Cole o link do Google Forms, preferencialmente terminado em /viewform
};
const intro=document.getElementById('intro'), music=document.getElementById('bgMusic');let introFinished=false,musicWanted=true;
function showScreen(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));document.getElementById('musicControls').classList.toggle('show',introFinished);window.scrollTo(0,0)}
let videoFallbackTimer=null;
function openEnvelope(){
 showScreen('videoScreen');
 intro.muted=false;
 intro.volume=1;
 intro.currentTime=0;
 const btn=document.getElementById('playIntro');
 btn.textContent='▶ Assistir à abertura';btn.classList.add('show');
 playIntroVideo();
 clearTimeout(videoFallbackTimer);
 videoFallbackTimer=setTimeout(()=>{
  if(!introFinished && !document.getElementById('videoScreen').classList.contains('active'))return;
  if(!introFinished && intro.paused){btn.textContent='▶ Tocar vídeo novamente';btn.classList.add('show');document.getElementById('skip').textContent='Continuar sem vídeo ›'}
 },4500);
}
function playIntroVideo(){
 const btn=document.getElementById('playIntro');btn.classList.remove('show');
 intro.muted=false;intro.volume=1;
 try{const p=intro.play();if(p&&p.catch)p.catch(()=>{btn.classList.add('show');btn.textContent='▶ Tocar vídeo';document.getElementById('skip').textContent='Continuar sem vídeo ›';});}
 catch(e){btn.classList.add('show');btn.textContent='▶ Tocar vídeo';}
}
intro.addEventListener('playing',()=>{clearTimeout(videoFallbackTimer);document.getElementById('playIntro').classList.remove('show')});
intro.addEventListener('stalled',()=>{if(intro.paused)document.getElementById('playIntro').classList.add('show')});
intro.addEventListener('waiting',()=>{document.getElementById('playIntro').classList.add('show');document.getElementById('playIntro').textContent='▶ Tentar reproduzir';});intro.addEventListener('ended',finishIntro);intro.addEventListener('error',()=>{document.getElementById('playIntro').classList.add('show');document.getElementById('playIntro').textContent='Vídeo indisponível — continuar abaixo';document.getElementById('skip').textContent='Continuar para o convite ›'});
function finishIntro(){if(introFinished)return;clearTimeout(videoFallbackTimer);introFinished=true;intro.pause();showScreen('mainScreen');startMusic()}
function startMusic(){if(!musicWanted)return;const p=music.play();if(p&&p.then)p.then(()=>updateMusic()).catch(()=>{musicWanted=false;updateMusic();document.getElementById('musicButton').textContent='♫ Ativar música';});}
function updateMusic(){document.getElementById('musicButton').textContent=musicWanted&&!music.paused?'♫ Pausar música':'♫ Ativar música'}
function toggleMusic(){if(music.paused){musicWanted=true;startMusic()}else{musicWanted=false;music.pause();updateMusic()}}
function openLocation(){window.open(CONFIG.localizacao,'_blank','noopener,noreferrer')}
function openConfirmation(){if(CONFIG.confirmacaoFormulario){window.open(CONFIG.confirmacaoFormulario,'_blank','noopener,noreferrer');return}if(CONFIG.confirmacaoWhatsApp){let msg='Olá! Gostaria de confirmar minha presença nos 15 anos da Sophia. 💗';window.open('https://wa.me/'+CONFIG.confirmacaoWhatsApp+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');return}alertModal('Confirmação de presença','Falta configurar o número de WhatsApp ou o link do formulário de confirmação no arquivo index.html.')}
function openForm(){showScreen('formScreen');let area=document.getElementById('formArea');if(!CONFIG.googleFormsRecados){area.innerHTML='<p>O formulário de recados ainda não foi conectado.</p><p class="hint">Adicione o link em googleFormsRecados no arquivo index.html.</p>';return}const url=CONFIG.googleFormsRecados;try{const u=new URL(url);if(u.protocol!=='https:'||!['docs.google.com','forms.gle'].includes(u.hostname))throw Error();if(u.hostname==='forms.gle'){area.innerHTML='<p>Abra o formulário para deixar seu recadinho.</p><a class="primary" target="_blank" rel="noopener noreferrer" href="'+u.href+'">Escrever recado ♡</a>';return}let embed=u.href.replace(/\?.*$/,'').replace(/\/edit$/,'/viewform');const frame=document.createElement('iframe');frame.title='Formulário de recados para Sophia';frame.src=embed+(embed.includes('?')?'&':'?')+'embedded=true';frame.loading='lazy';area.replaceChildren(frame)}catch(e){area.textContent='O link do Google Forms precisa ser válido e começar com https://.'}}
function alertModal(title,txt){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=txt;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
if(new URLSearchParams(location.search).get('editar')==='1')document.body.classList.add('edit');
</script></body></html>
